name: CI

on:
  # `push` is restricted to main deliberately. It used to be unrestricted,
  # which meant every push to a branch with an open PR fired *both* events and
  # ran the entire suite twice -- two mutation checks at ~10 minutes each, two
  # sanitizer runs, two of everything. The concurrency group below could not
  # collapse them because it keys on `event_name`, which puts the push run and
  # the pull_request run in separate groups by construction.
  #
  # With this restriction the two events can no longer collide on one ref: a
  # PR branch gets refs/pull/N/merge from `pull_request`, main gets
  # refs/heads/main from `push`.
  #
  # The trade is that a branch with no PR open gets no CI. `workflow_dispatch`
  # covers that case on demand, and the change-detection job below actually
  # gets *more* accurate for PRs, because the pull_request base is the merge
  # base rather than the previous push -- so a PR whose latest push is docs-only
  # still sees the code changes made earlier in the same PR.
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Cancel superseded runs per ref so the queue stays short. `event_name` stays
# in the key so a manual re-run does not cancel an in-flight push on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Does this push touch anything the mutation check could possibly answer
  # differently about?
  #
  # Mutation testing asks "do the tests actually exercise the shipped code",
  # and that answer cannot change unless production code, the tests, or the
  # check itself changed. Doc-only pushes were firing a ~20 minute job that was
  # incapable of finding anything.
  #
  # Computed with git rather than a third-party paths-filter action, and it
  # **fails toward running**: any case where the base cannot be determined (a
  # brand-new branch, a force-push, a shallow fetch) reports `true`. Skipping a
  # check that should have run is the expensive mistake; running one that need
  # not have costs minutes.
  # ---------------------------------------------------------------------------
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        run: |
          set -uo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          # Unknown, all-zero (new branch) or unreachable base -> run it.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "Base unavailable; running the mutation check."
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE" "${{ github.sha }}")
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^(components/|tests/|tools/mutation_|\.github/workflows/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "No code, test or mutation-tooling changes; skipping the mutation check."
          fi

  # ---------------------------------------------------------------------------
  # The same tests at the target's word size. Issue #255: an epoch bound of
  # 4294967295 was passed as a `long` parameter, narrowed to -1 on the ESP32-C3
  # (RISC-V, ILP32), and made `set_single_event` and `set_vacation` refuse every
  # input on real hardware -- while this suite listed `0,4294967295` among the
  # ACCEPTED inputs and stayed green on both compilers, because `long` is 64
  # bits on every host that runs them.
  #
  # This job removes that asymmetry instead of arguing around it: same test
  # file, same assertions, `long` at 32 bits. It needs no new test cases -- the
  # assertion that was already there fails here against the code that shipped
  # the bug.
  #
  # Separate from unit-tests rather than a third matrix leg: it builds one
  # binary, not the suite, and a failure should read as "the parser is not
  # word-size clean" rather than as a compiler leg breaking.
  # ---------------------------------------------------------------------------
  unit-tests-ilp32:
    name: Unit tests (32-bit long)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install 32-bit toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib g++-multilib

      # The Makefile target SKIPS when -m32 is unavailable, which is right for a
      # developer checkout and wrong here: a job that silently skips is a job
      # that proves nothing. Fail loudly on a missing multilib instead.
      - name: Confirm -m32 is actually available
        run: |
          printf 'int main(){return 0;}' > probe.c
          if ! g++ -m32 probe.c -o probe; then
            echo "::error::-m32 unavailable, so the ILP32 leg would skip rather than run"
            exit 1
          fi

      - name: Run the bridge tests with a 32-bit long
        run: make test-ilp32
        working-directory: tests

  # ---------------------------------------------------------------------------
  # Host unit tests, on both compilers. clang and gcc disagree often enough
  # about warnings and about UB in constant expressions to be worth both.
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Unit tests (${{ matrix.cxx }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
    steps:
      - uses: actions/checkout@v4

      - name: Run test suite
        run: make test
        working-directory: tests
        env:
          CXX: ${{ matrix.cxx }}

      # The suite built clean at -Wall -Wextra when this job was written; keep
      # it that way rather than letting warnings accumulate unread.
      - name: Fail on any compiler warning
        run: |
          make clean
          make all 2>&1 | tee build.log
          if grep -q "warning:" build.log; then
            echo "::error::Build produced compiler warnings"
            grep "warning:" build.log
            exit 1
          fi
        working-directory: tests
        env:
          # Without this the step falls back to Make's default g++ on both
          # matrix legs, so a clang-only warning is printed by the step above
          # and then never fails anything.
          CXX: ${{ matrix.cxx }}

  # ---------------------------------------------------------------------------
  # Memory: ASan + UBSan + LeakSanitizer.
  #
  # This is the job that would have caught the read-chain closure leaks. LSan
  # ships with ASan on Linux but does NOT run on macOS ARM, where most of this
  # is developed -- which is exactly why those leaks survived local testing.
  # ---------------------------------------------------------------------------
  sanitizers:
    name: Sanitizers (ASan/UBSan/LSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run suite under sanitizers
        run: make test-asan
        working-directory: tests
        env:
          ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          LSAN_OPTIONS: report_objects=1

  # ---------------------------------------------------------------------------
  # Mutation check: does the suite actually test the shipped code?
  #
  # Breaks production code on purpose and asserts the suite notices. This exists
  # because it once did not -- tests/protocol.h carried its own copy of the CRC
  # table and packet builder, so a total protocol break left `make test`
  # reporting 21/21.
  # ---------------------------------------------------------------------------
  mutation-check:
    name: Mutation check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Break production code and require the suite to notice
        run: ./tools/mutation_check.sh

  # ---------------------------------------------------------------------------
  # Static analysis. tools/lint.sh --strict treats warnings as errors.
  # ---------------------------------------------------------------------------
  static-analysis:
    name: cppcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Run cppcheck
        run: ./tools/lint.sh --strict

  # ---------------------------------------------------------------------------
  # Config validation. Fast, and the only thing that exercises the Python
  # codegen, the config schemas and the inline C++ lambdas in packages/.
  # ---------------------------------------------------------------------------
  config-validate:
    name: esphome config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install esphome
        run: pip install esphome

      # ruff's target-version has to track the oldest Python ESPHome supports,
      # not the one this job runs: components/ is executed inside the user's
      # ESPHome install. That floor is ESPHome's to move, and when it moves the
      # pin goes stale silently. Checked here rather than in the python job
      # because this one already has esphome installed and that job does not.
      - name: ruff target-version tracks ESPHome's floor
        run: python3 tools/check_ruff_target.py

      # Validates the working tree via external_components: type: local.
      - name: Validate CI config (working tree)
        run: esphome config tests/ci-compile.yaml

      # Two packages cannot share the config above and so had no working-tree
      # check at all -- the only examples that load them pin a release tag, so CI
      # was validating the last release of each rather than the branch.
      # alpha_hwr_schedule.yaml collides with alpha_hwr_controls.yaml on two
      # entity names and one id; alpha_hwr_base.yaml is a parallel copy of
      # alpha_hwr_pairing.yaml rather than an include.
      - name: Validate CI config, schedule UI (working tree)
        run: esphome config tests/ci-compile-schedule.yaml

      - name: Validate CI config, base package (working tree)
        run: esphome config tests/ci-compile-base.yaml

      # Some examples reference !secret. secrets.yaml is gitignored, so seed a
      # throwaway one here. ESPHome resolves !secret relative to the config
      # file, hence the second copy beside the nested example.
      #
      # Deliberately NOT `cp secrets-example.yaml secrets.yaml`. That template
      # ships an invalid api_key and a commented-out ota_password so that a user
      # who copies it and builds gets an error instead of a node secured with a
      # key published in this repository. CI therefore needs its own values, and
      # generates the key rather than hardcoding one, so no working key exists
      # in the tree at all.
      - name: Seed placeholder secrets
        run: |
          KEY=$(python -c 'import base64, secrets; print(base64.b64encode(secrets.token_bytes(32)).decode())')
          cat > secrets.yaml <<EOF
          wifi_ssid: "ci-ssid"
          wifi_password: "ci-wifi-password"
          ap_password: "ci-ap-password"
          api_key: "$KEY"
          ota_password: "ci-ota-password"
          EOF
          cp secrets.yaml components/alpha_hwr/secrets.yaml

      # The published examples pin a release tag, so this catches drift between
      # the documented recipes and the packages they load.
      - name: Validate example configs
        run: |
          status=0
          for f in hwr-pump-example.yaml hwr-pairing-example.yaml \
                   hwr-pump-schedule-example.yaml dhw-demand-example.yaml \
                   hwr-pump-dhw-example.yaml \
                   components/alpha_hwr/discovery_example.yaml; do
            echo "::group::$f"
            if ! esphome config "$f"; then
              echo "::error file=$f::esphome config failed"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status

  # ---------------------------------------------------------------------------
  # Full firmware build for the ESP32-C3. Slow, so it runs after the cheap jobs
  # and caches the toolchain. This is what catches a break that only shows up
  # when the real ESPHome/ESP-IDF headers are in play -- most of the component
  # is not host-compilable against tests/mocks.
  # ---------------------------------------------------------------------------
  firmware-build:
    name: ESP32-C3 firmware build
    runs-on: ubuntu-latest
    needs: [unit-tests, config-validate]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Cache PlatformIO and ESPHome
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.esphome
            ~/.cache/pip
          key: esp-idf-${{ runner.os }}-${{ hashFiles('tests/ci-compile.yaml', 'tests/ci-compile-schedule.yaml') }}
          restore-keys: |
            esp-idf-${{ runner.os }}-

      - name: Install esphome
        run: pip install esphome

      - name: Compile firmware
        run: esphome compile tests/ci-compile.yaml

      # The schedule UI's lambdas are not a subset of the controls UI's.
      # ControlMode::AUTO_ADAPT, AUTO_ADAPT_RADIATOR, AUTO_ADAPT_UNDERFLOOR and
      # AUTO_ADAPT_COMBINED are named all over compiled C++ (control_service.cpp
      # switches, mode_to_string, the MODES table, the host suite) -- but of the
      # YAML lambdas, only this package's name them. So renaming an enumerator
      # and letting the compiler find the callers fixes the C++ and
      # alpha_hwr_controls.yaml, whose six modes ARE built above, and silently
      # leaves this package broken. `esphome config` cannot catch it; it does not
      # compile lambda bodies.
      #
      # Cost, stated honestly: this is a second full build, not a marginal app
      # link. tests/.esphome is in the repo tree and is not in the cache above --
      # only ~/.platformio, ~/.esphome and ~/.cache/pip are -- and ESP-IDF builds
      # per project directory, so this roughly doubles the job. Kept because the
      # gap is real and otherwise invisible; if the wall time becomes a problem,
      # caching tests/.esphome is the lever, with the usual stale-object caveat.
      - name: Compile firmware, schedule UI
        run: esphome compile tests/ci-compile-schedule.yaml

      - name: Report image size
        if: always()
        run: |
          # ESPHome writes the build tree beside the config file, so this is
          # tests/.esphome -- not .esphome at the repo root.
          find tests/.esphome -name 'firmware*.bin' -o -name '*.elf' 2>/dev/null | head -10 || true
          # Both configs build here now, so report each rather than only the first.
          for d in ci-compile ci-compile-schedule; do
            ls -la "tests/.esphome/build/$d/build/" 2>/dev/null || true
          done

  # ---------------------------------------------------------------------------
  # Python: the two config schemas and the bench client. AGENTS §3 asks for
  # these; nothing ran them before.
  # ---------------------------------------------------------------------------
  python:
    name: Python lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install tooling
        run: pip install ruff mypy types-PyYAML

      - name: ruff
        run: ruff check components/ tools/

      - name: ruff format check
        run: ruff format --check components/ tools/

      # The component __init__.py files import esphome's codegen modules, which
      # are not installed here; check the standalone tooling strictly and the
      # schemas leniently.
      # Named explicitly rather than sweeping tools/: mutation_targets.py has
      # never been under mypy, and pulling it in here would fail this job on
      # something unrelated to whatever change added a script.
      - name: mypy
        run: mypy --ignore-missing-imports tools/write_bench.py tools/link_gap_report.py

      # The shell half of tools/, which had no check of any kind. Two of the
      # three scripts here decide whether a change is allowed to merge --
      # lint.sh IS the cppcheck job, and mutation_check.sh is the coverage
      # gate -- so a shell bug in them does not produce a wrong answer, it
      # produces a check that quietly stops checking. All three are clean at
      # -S style today; this is what keeps them that way.
      #
      # ubuntu-latest ships shellcheck, so there is nothing to install -- but the
      # runner image decides the version, and it is NOT the version a
      # contributor has locally. That is not hypothetical: the first run of this
      # step failed on an SC2015 that shellcheck 0.11.0 does not report at all,
      # so the tree was clean on the machine it was written on and red here.
      # Left floating on purpose, matching how ruff is installed above, but the
      # version is printed so the next such mismatch is one line of log rather
      # than an afternoon.
      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck --severity=style tools/*.sh

  # ---------------------------------------------------------------------------
  # The Lovelace card. 1700+ lines that had no automated check of any kind --
  # and which shipped broken against the current service signatures.
  # ---------------------------------------------------------------------------
  javascript:
    name: Lovelace card
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax check
        run: node --check homeassistant/www/alpha-hwr-schedule-card.js

      # Behaviour, not just parseability. Plain node against a stubbed DOM --
      # no npm install, nothing to keep current.
      - name: Card tests
        run: make test-js
        working-directory: tests

      # Every alpha_hwr service declares an op_id argument and Home Assistant
      # registers those as required, so a call without one is rejected before it
      # reaches the device -- silently, since the rejection is only an unhandled
      # promise. The card shipped that way on all seven call sites. Cheap
      # guard against it regressing.
      - name: Every esphome service call must carry an op_id
        run: |
          if grep -n "callService('esphome'" homeassistant/www/alpha-hwr-schedule-card.js \
             | grep -v "op_id"; then
            echo "::error::esphome service call without op_id (see the lines above)"
            exit 1
          fi
          echo "OK: all esphome service calls route through the op_id helper"
