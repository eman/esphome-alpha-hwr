name: Unit Tests

on:
  push:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# A push to a branch with an open PR fires both events; cancel superseded
# runs per ref so the queue stays short.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Run C++ Unit Tests
        run: |
          cd tests
          make test
