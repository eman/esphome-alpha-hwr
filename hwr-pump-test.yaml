<<: !include hwr-pump.yaml

globals:
  - id: hardware_test_run
    type: bool
    initial_value: 'false'

interval:
  - interval: 2s
    then:
      - if:
          condition:
            lambda: 'return !id(hardware_test_run) && id(pump).is_state_synchronized();'
          then:
            - lambda: 'id(hardware_test_run) = true;'
            - script.execute: run_schedule_hardware_test

script:
  - id: run_schedule_hardware_test
    then:
      - lambda: |-
          ESP_LOGI("hw_test", "========================================");
          ESP_LOGI("hw_test", "Starting Schedule Hardware Test on Layer 4...");
          ESP_LOGI("hw_test", "========================================");
          
          esphome::alpha_hwr::ScheduleEntry entry("Monday", 1, 15, 2, 30, 0x02, 4, true);
          id(pump).set_schedule_entry(4, 0, entry, [](bool ok) {
            ESP_LOGI("hw_test", "TEST STEP 1 (Write Entry Mon L4): %s", ok ? "PASS" : "FAIL");
          });
      - delay: 5s
      - lambda: |-
          id(pump).read_schedule_entries_async(4, [](bool ok, const std::vector<esphome::alpha_hwr::ScheduleEntry>& entries) {
            bool found = false;
            for (const auto& e : entries) {
              if (e.get_day_index() == 0 && e.get_begin_hour() == 1 && e.get_begin_minute() == 15) {
                found = true;
                break;
              }
            }
            ESP_LOGI("hw_test", "TEST STEP 2 (Verify Write Mon L4): %s", found ? "PASS" : "FAIL");
          });
      - delay: 5s
      - lambda: |-
          id(pump).clear_schedule_entry_async(4, 0, [](bool ok) {
            ESP_LOGI("hw_test", "TEST STEP 3 (Clear Entry Mon L4): %s", ok ? "PASS" : "FAIL");
          });
      - delay: 5s
      - lambda: |-
          id(pump).read_schedule_entries_async(4, [](bool ok, const std::vector<esphome::alpha_hwr::ScheduleEntry>& entries) {
            bool found = false;
            for (const auto& e : entries) {
              if (e.get_day_index() == 0) found = true;
            }
            ESP_LOGI("hw_test", "TEST STEP 4 (Verify Clear Mon L4): %s", !found ? "PASS" : "FAIL");
            
            ESP_LOGI("hw_test", "========================================");
            ESP_LOGI("hw_test", "Hardware Test Complete.");
            ESP_LOGI("hw_test", "========================================");
          });
