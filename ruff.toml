# Pinning the rule set explicitly so a ruff upgrade cannot change what CI
# enforces. Without this, ruff's defaults drift between versions and the same
# tree passes locally and fails in CI (which is exactly what happened).

line-length = 120

# The floor ESPHome supports (2026.7 declares >=3.12,<3.15), not the version CI
# happens to run. components/ is executed inside the user's ESPHome install, so
# a UP rule that rewrites to 3.14-only syntax would break anyone on 3.12.
#
# tools/check_ruff_target.py asserts this still matches the installed ESPHome's
# Requires-Python floor, and CI runs it -- so when ESPHome raises its minimum,
# the build says so instead of leaving the pin quietly stale. Raising it is a
# deliberate decision (it lets ruff rewrite the schemas to syntax the previous
# floor cannot run), which is why the check reports rather than auto-fixes.
target-version = "py312"

[lint]
# pycodestyle errors/warnings, pyflakes, import sorting, and the bugbear subset
# that catches real mistakes rather than style opinions.
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
  # dhw_demand/__init__.py holds long single-line cv.Schema entries whose
  # readability does not improve from wrapping.
  "E501",
]

[lint.per-file-ignores]
# ESPHome component schemas import codegen modules for side effects and use
# star-style config constants; neither is a defect here.
"components/*/__init__.py" = ["F401"]

[format]
quote-style = "double"
