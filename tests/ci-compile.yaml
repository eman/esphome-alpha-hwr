# Firmware compile check for CI.
#
# The example configs in the repo root pin `github://...@vX.Y.Z`, so compiling
# them validates the last *release*, not the branch under test. This config
# includes the packages from disk and overrides `component_source` to the
# working tree, so a push that breaks codegen, a YAML lambda, or the C++ fails
# here rather than on someone's pump.
#
# Nothing device-specific: placeholder MAC and credentials, never flashed.

esphome:
  name: ci-compile
  friendly_name: "CI Compile Check"
  project:
    name: "grundfos.alpha_hwr"
    version: "ci"

substitutions:
  mac_address: "00:00:00:00:00:00"
  # dhw_demand_detector.yaml expects these Home Assistant entity ids.
  flow_entity: sensor.ci_flow_rate
  tank_lower_temp_entity: sensor.ci_tank_lower_temperature
  dhw_charge_entity: sensor.ci_dhw_charge
  # Point the packages' `external_components` at the working tree instead of the
  # release tag, so a push that breaks codegen or the C++ fails here rather than
  # on someone's pump. Declaring a second `external_components` entry here would
  # not do it: the tag's entry survives the merge, gets cloned, and only loses
  # the component by an ordering accident in ESPHome's loader.
  component_source: ../components
  # Overridden on the command line for the first CI build; see `logger:`.
  log_level: VERY_VERBOSE

packages:
  alpha_hwr: !include ../packages/alpha_hwr.yaml
  alpha_hwr_controls: !include ../packages/alpha_hwr_controls.yaml
  dhw_demand: !include ../packages/dhw_demand_detector.yaml

# The gap histogram (issue #176 part 1) is commented out in the pairing package
# on purpose -- it is a measurement instrument, not something every install
# should carry. Declared here so its schema and codegen are still compiled and
# validated on every CI run; without this the eight config keys and their eight
# setters would have no coverage anywhere.
#
# data_timeout is raised to match, so the config-time warning about counters
# that cannot fill does not fire on a config that is doing the right thing.
alpha_hwr:
  data_timeout: 600s
  # ready_timeout is on by default, so the naming path compiles anyway. This
  # turns on the half that does NOT ship by default, so the recycle path is
  # built into a firmware image somewhere rather than existing only in host
  # tests. This file already deviates from production for the same kind of
  # reason (data_timeout above, and the whole gap histogram below).
  ready_recycle: true
  # Nothing else in CI sets frame_logging at all, so a rename or a broken
  # validator would go unnoticed. Turning it on here is a schema check; the
  # codegen call is unconditional, so no extra code is compiled either way.
  frame_logging: true
  link_gaps_over_15s:
    name: "Pump Link Gaps Over 15s"
  link_gaps_over_20s:
    name: "Pump Link Gaps Over 20s"
  link_gaps_over_30s:
    name: "Pump Link Gaps Over 30s"
  link_gaps_over_45s:
    name: "Pump Link Gaps Over 45s"
  link_gaps_over_60s:
    name: "Pump Link Gaps Over 60s"
  link_gaps_over_90s:
    name: "Pump Link Gaps Over 90s"
  link_gaps_truncated:
    name: "Pump Link Gaps Truncated"
  link_watch_time:
    name: "Pump Link Watched Time"

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf

wifi:
  ssid: "ci-ssid"
  password: "ci-password"

# Required by the alpha_hwr write services + write_settled event (issue #92).
api:
  custom_services: true
  homeassistant_services: true
  encryption:
    # No key on purpose: ESPHome 2026.9 rejects the all-zeros placeholder this
    # carried, and a real one would put a working key in the tree. With the key
    # omitted the node provisions one at runtime, which is all a config check
    # or compile needs.

ota:
  - platform: esphome
    password: "ci-ota"

# CI compiles this config twice, at both ends of the log range (see the
# firmware-build job in .github/workflows/test.yml), because each end hides a
# warning the other shows:
#
# - VERY_VERBOSE compiles every log statement in. Below the configured level an
#   ESP_LOGx line is compiled out entirely, and the host mocks never check
#   format strings, so at production's INFO nothing type-checks a LOGD/LOGV
#   format against the device's integer widths. On the ESP32-C3 `uint32_t` is
#   `long unsigned int`, so a `%u` that is fine on a host is wrong here.
# - NONE compiles every log statement out. A compiled-out ESP_LOGx expands to
#   nothing, so an unbraced `if (x) ESP_LOGD(...);` becomes `if (x);` and GCC
#   warns -Wempty-body (#337). At VERY_VERBOSE that shape compiles cleanly.
#
# VERY_VERBOSE is the default here; the job passes `-s log_level NONE` for the
# other build.
logger:
  level: ${log_level}
