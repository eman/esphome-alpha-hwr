# Firmware compile check for CI.
#
# The example configs in the repo root pin `github://...@vX.Y.Z`, so compiling
# them validates the last *release*, not the branch under test. This config
# includes the packages from disk and overrides `component_source` to the
# working tree, so a push that breaks codegen, a YAML lambda, or the C++ fails
# here rather than on someone's pump.
#
# Nothing device-specific: placeholder MAC and credentials, never flashed.

esphome:
  name: ci-compile
  friendly_name: "CI Compile Check"
  project:
    name: "grundfos.alpha_hwr"
    version: "ci"

substitutions:
  mac_address: "00:00:00:00:00:00"
  # dhw_demand_detector.yaml expects these Home Assistant entity ids.
  flow_entity: sensor.ci_flow_rate
  tank_lower_temp_entity: sensor.ci_tank_lower_temperature
  dhw_charge_entity: sensor.ci_dhw_charge
  # Point the packages' `external_components` at the working tree instead of the
  # release tag, so a push that breaks codegen or the C++ fails here rather than
  # on someone's pump. Declaring a second `external_components` entry here would
  # not do it: the tag's entry survives the merge, gets cloned, and only loses
  # the component by an ordering accident in ESPHome's loader.
  component_source: ../components

packages:
  alpha_hwr: !include ../packages/alpha_hwr_pairing.yaml
  alpha_hwr_controls: !include ../packages/alpha_hwr_controls.yaml
  alpha_hwr_schedule_editor: !include ../packages/alpha_hwr_schedule_editor.yaml
  dhw_demand: !include ../packages/dhw_demand_detector.yaml

# The gap histogram (issue #176 part 1) is commented out in the pairing package
# on purpose -- it is a measurement instrument, not something every install
# should carry. Declared here so its schema and codegen are still compiled and
# validated on every CI run; without this the eight config keys and their eight
# setters would have no coverage anywhere.
#
# data_timeout is raised to match, so the config-time warning about counters
# that cannot fill does not fire on a config that is doing the right thing.
alpha_hwr:
  data_timeout: 600s
  link_gaps_over_15s:
    name: "Pump Link Gaps Over 15s"
  link_gaps_over_20s:
    name: "Pump Link Gaps Over 20s"
  link_gaps_over_30s:
    name: "Pump Link Gaps Over 30s"
  link_gaps_over_45s:
    name: "Pump Link Gaps Over 45s"
  link_gaps_over_60s:
    name: "Pump Link Gaps Over 60s"
  link_gaps_over_90s:
    name: "Pump Link Gaps Over 90s"
  link_gaps_truncated:
    name: "Pump Link Gaps Truncated"
  link_watch_time:
    name: "Pump Link Watched Time"

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf

wifi:
  ssid: "ci-ssid"
  password: "ci-password"

# Required by the alpha_hwr write services + write_settled event (issue #92).
api:
  custom_services: true
  homeassistant_services: true
  encryption:
    key: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="

ota:
  - platform: esphome
    password: "ci-ota"

logger:
  level: INFO
