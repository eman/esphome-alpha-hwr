esphome:
  name: hwr-pump-example
  friendly_name: HWR Pump (Example)

# ==============================================================================
# ALPHA HWR Example Configuration
# ==============================================================================
#
# The pump package on its own: full telemetry and diagnostics, no control UI.
# For the control UI see hwr-pump-controls-example.yaml; for the DHW demand
# detector alongside it, hwr-pump-dhw-example.yaml.
#
# Setup:
# 1. Replace the MAC address below with your pump's BLE MAC address.
# 2. Create secrets.yaml at the repository root (see README, "Examples in this
#    repo"); examples/secrets.yaml is a symlink to it. The template's key and
#    OTA password are deliberately unusable, so the build fails until you set
#    your own.
# 3. Put the pump into Bluetooth pairing mode and flash. See README, "Pairing".
# ==============================================================================

substitutions:
  mac_address: "00:00:00:00:00:00"  # ← CHANGE THIS to your pump's MAC

packages:
  # Pinned to the last release, where the pump package still carried its old
  # name. On main it is packages/alpha_hwr.yaml; the release script moves this
  # line at the next release.
  alpha_hwr: github://eman/esphome-alpha-hwr/packages/alpha_hwr_pairing.yaml@v0.16.0

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  ap:
    ssid: hwr-pump-fallback
    password: !secret ap_password

captive_portal:

# The alpha_hwr package sets `logger: level: INFO`. Every log line is an API
# frame fanned out to every connected subscriber, so DEBUG is opt-in — uncomment
# while troubleshooting, and prefer keeping at most one `esphome logs` stream
# attached alongside Home Assistant (issue #127).
# logger:
#   level: DEBUG

api:
  # Required by the alpha_hwr programmatic write services + write_settled event (issue #92)
  custom_services: true
  homeassistant_services: true
  encryption:
    # From secrets.yaml, so this file never carries a working key. Generate
    # your own with `esphome wizard` or
    # https://esphome.io/components/api.html#configuration-variables — a
    # published key exposes every pump write service to anything on your LAN.
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password  # guards OTA firmware upload

# Additional Sensors (optional)
sensor:  
  - platform: wifi_signal
    name: "WiFi Signal Strength"
    update_interval: 60s

  - platform: uptime
    name: "Uptime"

binary_sensor:
  - platform: status
    name: "HWR Pump Status"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
    ssid:
      name: "WiFi SSID"
    bssid:
      name: "WiFi BSSID"
    mac_address:
      name: "WiFi MAC"

button:
  - platform: restart
    name: "Restart HWR Pump"

# Optional: Add schedule control switch
# For the full control UI, including schedule management, control modes and
# remote mode, see: hwr-pump-controls-example.yaml
# Uncomment to enable schedule management
# switch:
#   - platform: template
#     name: "Schedule Enabled"
#     icon: "mdi:calendar-clock"
#     optimistic: true
#     restore_mode: RESTORE_DEFAULT_OFF
#     turn_on_action:
#       - lambda: |-
#           // enable_schedule() submits the write and returns whether it was
#           // accepted for submission -- always true here. The pump's actual
#           // answer arrives later as a set_schedule_enabled write_settled
#           // event; listen for that if you need to know it landed.
#           id(pump).enable_schedule();
#     turn_off_action:
#       - lambda: |-
#           id(pump).disable_schedule();
