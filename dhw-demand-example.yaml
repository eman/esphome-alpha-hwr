esphome:
  name: dhw-detector
  friendly_name: DHW Detector

# ==============================================================================
# DHW Demand Detector — Example Configuration
# ==============================================================================
#
# On-device DHW demand detection using pump telemetry and Home Assistant sensors.
# Detection results appear automatically in Home Assistant via the native API.
#
# Setup Instructions:
# 1. Replace the MAC address below with your ALPHA HWR pump's BLE MAC address
# 2. Set the three HA entity substitutions to match your installation
# 3. Create your secrets file and fill in your own values:
#      cp secrets-example.yaml secrets.yaml
#    Not optional: this config reads WiFi, the API encryption key and the
#    OTA password from it, and the template's key and OTA password are
#    deliberately unusable so that copying it and building fails rather
#    than producing a node anyone can read or reflash.
# 4. Flash to your ESP32
#
# Sensors published to Home Assistant:
#   binary_sensor.dhw_detector_dhw_demand            — ON when hot water is being drawn
#   sensor.dhw_detector_dhw_detection_confidence     — Detection certainty (0.0–1.0)
#   sensor.dhw_detector_dhw_session_duration         — Seconds since session started (live)
#   text_sensor.dhw_detector_dhw_detection_method    — Which signal(s) triggered demand
#
# For standalone use (no pump), remove the alpha_hwr package and the
# pump sensor keys from dhw_demand: below. Pump-off detection via the
# flow meter, tank temperature, and DHW charge still works fully.
# ==============================================================================

substitutions:
  mac_address: "AA:BB:CC:DD:EE:FF"  # ← CHANGE THIS to your pump's MAC

  # ── Home Assistant entity IDs for supplementary sensors ────────────────────
  flow_entity:            sensor.your_flow_sensor             # ← CHANGE to your flow meter entity
  tank_lower_temp_entity: sensor.your_tank_lower_temperature  # ← CHANGE to your tank temp entity
  dhw_charge_entity:      sensor.your_dhw_charge              # ← CHANGE to your DHW charge entity

# The packages declare their own matching `external_components` at the same tag,
# so no separate block is needed here. Do not add one pointing at a local
# checkout: a release-pinned package against a working-tree component disagree
# whenever a config key changes between releases, and the config stops
# validating.
packages:
  alpha_hwr: github://eman/esphome-alpha-hwr/packages/alpha_hwr_pairing.yaml@v0.16.0
  dhw_demand: github://eman/esphome-alpha-hwr/packages/dhw_demand_detector.yaml@v0.16.0

esp32:
  board: esp32dev
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_key

logger:

ota:
  - platform: esphome
    password: !secret ota_password

# ── Alpha HWR sensor IDs ───────────────────────────────────────────────────────
#
# Give the pump sensors stable IDs so dhw_demand: can reference them below.
# These merge with the sensor declarations already made by alpha_hwr_pairing.yaml.

alpha_hwr:
  current:
    id: motor_current_sensor
  rpm:
    id: motor_speed_sensor
  flow:
    id: flow_rate_sensor

# ── Unit-converted pump sensor intermediates ──────────────────────────────────
#
# alpha_hwr reports flow in m³/h; the detector expects GPM, so we create a
# converted copy. Do not reference flow_rate_sensor directly or the thresholds
# will be wrong by a factor of 4.4.

sensor:
  # Pump flow: m³/h → GPM  (1 m³/h = 4.40287 GPM)
  - platform: copy
    source_id: flow_rate_sensor
    id: dhw_pump_flow_gpm
    name: ""
    internal: true
    unit_of_measurement: "GPM"
    filters:
      - multiply: 4.40287

  # Optional: water-heater DHW in-use flag — provides a small confidence
  # boost. Remove if your water heater does not expose one.
  #
  # Read as a float, so the HA entity must report numeric 0/1. A binary_sensor
  # (state "on"/"off") parses as NaN and the tier silently never fires; map it
  # to a numeric template sensor in HA first.
  - platform: homeassistant
    id: dhw_in_use_flag
    entity_id: sensor.your_dhw_in_use  # ← CHANGE to your DHW in-use entity

# ── DHW Demand Detector — pump telemetry wiring ────────────────────────────────
#
# Adds pump sensor references to the detector component declared by the package.

dhw_demand:
  motor_speed:    motor_speed_sensor
  motor_current:  motor_current_sensor
  # motor_speed and pump_flow are what pump-on detection runs on: household
  # demand while the pump is running is measured as (flow - pump_flow), gated
  # on motor_speed. Without both, the detector still works while the pump is
  # off and reports pump_on_uncertain whenever it is running.
  pump_flow:      dhw_pump_flow_gpm
  # Optional: comment out if your water heater exposes no in-use flag
  dhw_in_use:     dhw_in_use_flag
