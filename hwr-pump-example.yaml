esphome:
  name: hwr-pump-example
  friendly_name: HWR Pump (Example)

# ==============================================================================
# Basic ALPHA HWR Example Configuration
# ==============================================================================
# 
# This example demonstrates basic telemetry monitoring without BLE pairing.
#
# Setup Instructions:
# 1. Replace the MAC address below with your pump's BLE MAC address
# 2. Create your secrets file and fill in your own values:
#      cp secrets-example.yaml secrets.yaml
#    This config reads WiFi, the API encryption key and the OTA password from
#    it, so there is nothing to edit here and no working credential is carried
#    in this file. ESPHome refuses to build until each secret is defined —
#    which is the point: a config that ships a key anyone can read is not
#    encrypted, and a published OTA password lets anything on your LAN flash
#    this node.
# 3. Flash to your ESP32
# ==============================================================================

substitutions:
  mac_address: "00:00:00:00:00:00"  # ← CHANGE THIS to your pump's MAC

packages:
  alpha_hwr: github://eman/esphome-alpha-hwr/packages/alpha_hwr_base.yaml@v0.16.0

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  ap:
    ssid: hwr-pump-fallback
    password: !secret ap_password

captive_portal:

# The alpha_hwr package sets `logger: level: INFO`. Every log line is an API
# frame fanned out to every connected subscriber, so DEBUG is opt-in — uncomment
# while troubleshooting, and prefer keeping at most one `esphome logs` stream
# attached alongside Home Assistant (issue #127).
# logger:
#   level: DEBUG

api:
  # Required by the alpha_hwr programmatic write services + write_settled event (issue #92)
  custom_services: true
  homeassistant_services: true
  encryption:
    # From secrets.yaml, so this file never carries a working key. Generate
    # your own with `esphome wizard` or
    # https://esphome.io/components/api.html#configuration-variables — a
    # published key exposes every pump write service to anything on your LAN.
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password  # guards OTA firmware upload

# Additional Sensors (optional)
sensor:  
  - platform: wifi_signal
    name: "WiFi Signal Strength"
    update_interval: 60s

  - platform: uptime
    name: "Uptime"

binary_sensor:
  - platform: status
    name: "HWR Pump Status"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
    ssid:
      name: "WiFi SSID"
    bssid:
      name: "WiFi BSSID"
    mac_address:
      name: "WiFi MAC"

button:
  - platform: restart
    name: "Restart HWR Pump"

# Optional: Add schedule control switch
# For a complete example with schedule management, control modes, and remote mode,
# see: hwr-pump-schedule-example.yaml
# Uncomment to enable schedule management
# switch:
#   - platform: template
#     name: "Schedule Enabled"
#     icon: "mdi:calendar-clock"
#     optimistic: true
#     restore_mode: RESTORE_DEFAULT_OFF
#     turn_on_action:
#       - lambda: |-
#           // enable_schedule() submits the write and returns whether it was
#           // accepted for submission -- always true here. The pump's actual
#           // answer arrives later as a set_schedule_enabled write_settled
#           // event; listen for that if you need to know it landed.
#           id(pump).enable_schedule();
#     turn_off_action:
#       - lambda: |-
#           id(pump).disable_schedule();
