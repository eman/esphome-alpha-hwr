# Copy to secrets.yaml and fill in your own values. secrets.yaml is gitignored;
# this template is not, so never put real credentials here.
#
#   cp secrets-example.yaml secrets.yaml
#
# The three security-critical values below are deliberately unusable: `api_key`
# is not a valid key, `ap_password` is too short, and `ota_password` is
# commented out. Copying this file and building gives you an error naming the
# one you have not set yet, which is the intended behaviour — a template whose
# defaults merely *look* like placeholders gets flashed as-is, and then the
# encryption key guarding every pump write service is one that anybody can read
# in this repository.
#
# CI does not use this file. It writes its own throwaway secrets with a freshly
# generated key, precisely so that these placeholders are free to fail.
#
# `components/alpha_hwr/discovery_example.yaml` is nested, and ESPHome resolves
# !secret relative to the config file, so that one needs its own copy:
#
#   cp secrets.yaml components/alpha_hwr/secrets.yaml

wifi_ssid: "your-wifi-ssid"
wifi_password: "your-wifi-password"

# Fallback hotspot the node raises when it cannot reach your WiFi, and which
# `hwr-pump-example.yaml` pairs with `captive_portal:`. Anyone in range can join
# it and reach that portal, so a value published here would be a real opening,
# not a formality. ESPHome requires 8-64 characters; the placeholder is 6, so it
# is rejected until you change it.
#
# ESPHome also accepts an *empty* value, which leaves the hotspot open with no
# password at all. Set a real one rather than blanking it.
ap_password: "SET-ME"

# Base64, 32 bytes. Generate your own — `esphome wizard` prints one, or see
#   https://esphome.io/components/api.html#configuration-variables
# The value below is not valid base64 of the right length, so ESPHome will
# reject it until you replace it.
api_key: "REPLACE-ME-WITH-A-GENERATED-KEY"

# Guards OTA firmware upload: without it, anything on your LAN can flash this
# node. Uncomment and set your own.
#
# Leaving this line commented out does NOT give you unauthenticated OTA — the
# examples all reference `!secret ota_password`, so the build fails with
# "Secret 'ota_password' not defined". To genuinely run without OTA
# authentication, delete the `password:` line from the `ota:` block of the
# example itself. Note that setting an *empty* value here has that same effect
# silently, which is the trap worth knowing about.
#
# ota_password: "your-ota-password"
