# ==============================================================================
# ALPHA HWR Base Package
# ==============================================================================
# 
# This package provides basic telemetry from the Grundfos ALPHA HWR pump, with
# this node never INITIATING BLE pairing. Use it for simple monitoring.
#
# The pump still has to be paired to this node. The package used to say it
# worked "without BLE pairing/bonding", and that is wrong in two separate ways
# (issues #244 and #245):
#
#   1. Not initiating is not the same as not bonding. The pump can initiate, and
#      ESPHome consents on our behalf before this component sees the event -- a
#      node on this package was observed bonding four times in twenty minutes
#      (#245). So this package does not deliver an unbonded node, and never did.
#
#   2. A peer the pump has never bonded to cannot hold a connection at all
#      (#244, measured 2026-09-27). From a never-paired Linux host, three
#      direct connection requests in a row drew no link-layer reply: the
#      controller gave each one up within 150-300 ms with "Connection Failed to
#      be Established (0x3e)". A peer whose address the pump DOES hold a bond
#      for gets one stage further -- the link opens, and the pump drops it about
#      2 s later for failing to encrypt (#230; 90 cycles measured on ESP32s,
#      zero GENI frames). The sibling client's docs record the same ~1.8 s drop,
#      and the GO app's own code will not discover services on an unbonded link.
#
# So: use this package for monitoring, and pair the pump to the node first
# (docs/configuration.md, "Pairing"). The one configuration still unobserved is
# a factory-fresh pump that has never bonded to anything; if yours reaches Pump
# Ready with no pairing step, please report it on #244.
#
# Telemetry Included:
# - Flow Rate (m³/h)
# - Head (m)
# - Water Temperature (°C)
# - Motor Speed (RPM)
# - Power Consumption (W)
#
# Requirements:
# - ESP32 with BLE support
# - Substitutions: ${mac_address} must be defined
#
# Usage:
#   substitutions:
#     mac_address: "AA:BB:CC:DD:EE:FF"
#   
#   packages:
#     alpha_hwr: !include packages/alpha_hwr_base.yaml
#
# For enhanced telemetry (voltage, current, all temperatures), 
# use alpha_hwr_pairing.yaml instead.
# ==============================================================================

substitutions:
  # This component's release version, surfaced as the "Component Version"
  # diagnostic entity below (issue #95). Kept in sync automatically by
  # tools/bump_version.sh, which rewrites it alongside the @vX.Y.Z package pin.
  component_version: "0.16.0"

  # Where the component's C++ and codegen are loaded from. Overridable so a
  # config can point it at a working tree without also having to declare a
  # second `external_components` entry: two sources for the same component name
  # both resolve, both get fetched, and which one *wins* comes down to
  # `install_meta_finder` inserting each at the front of `sys.meta_path` -- last
  # processed wins, which is neither stated in the config nor stable if the
  # merge order ever changes. The tests/ci-compile*.yaml configs set this to
  # `../components`; ESPHome's shorthand source validator tries a filesystem
  # directory before the github:// pattern, so one substitution covers both.
  #
  # Rewritten by tools/bump_version.sh, which matches the @vX.Y.Z.
  component_source: github://eman/esphome-alpha-hwr@v0.16.0

esphome:
  # Publish the (constant) component version once at boot (issue #95).
  on_boot:
    priority: -100
    then:
      - text_sensor.template.publish:
          id: component_version_sensor
          state: "${component_version}"

external_components:
  - source: ${component_source}
    components: [alpha_hwr, dhw_demand]

logger:
  # INFO by default: every log line is an API frame fanned out to *every*
  # subscriber, and a node being actively debugged (Home Assistant + an
  # `esphome logs` stream + a script) is exactly when heap pressure on the API
  # write path can reboot it (issue #127). Override with `logger: level: DEBUG`
  # in your own config when you need it — the main config wins over the package.
  level: INFO

# Runtime heap, so a slow leak or fragmentation trend is visible before it
# aborts in the API write path, and answerable afterwards (issue #127).
# These publish on every 60s poll — heap genuinely moves, so unlike the control
# entities there is nothing here to gate on change.
debug:
  update_interval: 60s

sensor:
  - platform: debug
    free:
      name: "Free Heap"
    block:
      name: "Largest Free Block"
    min_free:
      name: "Min Free Heap"
    fragmentation:
      name: "Heap Fragmentation"

text_sensor:
  # This ESPHome component's own version (issue #95), for post-hoc
  # identification in Home Assistant history / bug reports.
  - platform: template
    name: "Component Version"
    id: component_version_sensor
    icon: "mdi:package-variant"
    entity_category: diagnostic
    update_interval: never  # constant value; published once at boot (see esphome.on_boot)

  # Why the node last rebooted — published once at boot. A panic reboot is
  # otherwise indistinguishable from an OTA or a power cycle after the fact.
  - platform: debug
    reset_reason:
      name: "Reset Reason"

esp32_ble_tracker:
  # The ESP32 shares one radio between WiFi and BLE. A window equal to the
  # interval scans 100% of the time, which ESPHome warns starves WiFi. 30 ms of
  # every 320 ms (ESPHome's default, ~9%) still sees the pump's advertisements:
  # benched 2026-09-27, READY 11 s after boot with advertisement identifiers
  # populated. It did not remove the node's multi-second WiFi stalls (PR #320).
  scan_parameters:
    interval: 320ms
    window: 30ms
  # Populate advertisement identifiers (product_version etc.) before the
  # GATT connection opens.  ESPHome's BLEClientNode does not receive scan
  # result events directly, so we hook them here via the tracker trigger.
  # Filtered by MAC so a second Grundfos device on the same network cannot
  # populate the one-shot advertisement cache with the wrong identifiers.
  on_ble_service_data_advertise:
    - mac_address: ${mac_address}
      service_uuid: FE5D
      then:
        - lambda: "pump->on_ble_service_data_seen(x);"

ble_client:
  - mac_address: ${mac_address}
    id: hwr_pump_client

api:
  # Required by the alpha_hwr programmatic write services + write_settled event (issue #92)
  custom_services: true
  homeassistant_services: true

time:
  - platform: homeassistant
    id: hwr_time

alpha_hwr:
  id: pump
  ble_client_id: hwr_pump_client
  time_id: hwr_time
  flow:
    name: "Flow Rate"
  head:
    name: "Head"
  temp_media:
    name: "Water Temperature"
  rpm:
    name: "Motor Speed"
  power:
    name: "Power Consumption"
  ready_status:
    name: "Pump Ready"
    id: pump_ready
  # Which build is installed: component source revision + firmware build time.
  # "Component Version" above is the release version and only changes at a
  # release, so it cannot tell two builds apart (issue #124).
  component_build:
    name: "Component Build"
