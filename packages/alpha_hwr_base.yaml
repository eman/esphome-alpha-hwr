# ==============================================================================
# ALPHA HWR Base Package
# ==============================================================================
# 
# This package provides basic telemetry from the Grundfos ALPHA HWR pump
# without BLE pairing/bonding. Use this for simple monitoring scenarios.
#
# Telemetry Included:
# - Flow Rate (m³/h)
# - Head Pressure (kPa)
# - Water Temperature (°C)
# - Motor Speed (RPM)
# - Power Consumption (W)
#
# Requirements:
# - ESP32 with BLE support
# - Substitutions: ${mac_address} must be defined
#
# Usage:
#   substitutions:
#     mac_address: "AA:BB:CC:DD:EE:FF"
#   
#   packages:
#     alpha_hwr: !include packages/alpha_hwr_base.yaml
#
# For enhanced telemetry (voltage, current, all temperatures), 
# use alpha_hwr_pairing.yaml instead.
# ==============================================================================

external_components:
  - source: github://eman/esphome-alpha-hwr@v0.8.0
    components: [alpha_hwr, dhw_demand]

esp32_ble_tracker:
  scan_parameters:
    interval: 1.1s
    window: 1.1s
  # Populate advertisement identifiers (product_version etc.) before the
  # GATT connection opens.  ESPHome's BLEClientNode does not receive scan
  # result events directly, so we hook them here via the tracker trigger.
  # Filtered by MAC so a second Grundfos device on the same network cannot
  # populate the one-shot advertisement cache with the wrong identifiers.
  on_ble_service_data_advertise:
    - mac_address: ${mac_address}
      service_uuid: FE5D
      then:
        - lambda: "pump->on_ble_service_data_seen(x);"

ble_client:
  - mac_address: ${mac_address}
    id: hwr_pump_client

alpha_hwr:
  id: pump
  ble_client_id: hwr_pump_client
  # Optional: Configure periodic control state polling to detect out-of-band
  # pump state changes (internal schedules, manual button presses, external app
  # control). Polls the pump for state changes at regular intervals.
  # Default: 30 seconds. Set to 0 to disable polling if you guarantee
  # exclusive component control (issue #54).
  # control_state_poll_interval: 30s
  flow:
    name: "Flow Rate"
  head:
    name: "Head Pressure"
  temp_media:
    name: "Water Temperature"
  rpm:
    name: "Motor Speed"
  power:
    name: "Power Consumption"
