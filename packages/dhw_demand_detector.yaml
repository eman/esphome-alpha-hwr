# ==============================================================================
# DHW Demand Detector Package — Supplementary Sensors
# ==============================================================================
#
# Imports the Home Assistant supplementary sensors needed by the DHW demand
# detector and declares the detector component with those sensors wired.
#
# This package works standalone (no pump required). Pump telemetry can be
# added in your main YAML to enable pump-on detection; see the example at
# dhw-demand-example.yaml.
#
# Required substitutions (must be set in your main YAML):
#   ${flow_entity}            — HA entity ID for flow meter (GPM)
#   ${tank_lower_temp_entity} — HA entity ID for lower tank temperature (°F)
#   ${dhw_charge_entity}      — HA entity ID for DHW charge %
#
# Usage (standalone, no pump):
#
#   substitutions:
#     flow_entity:            sensor.dhw_flow_rate
#     tank_lower_temp_entity: sensor.water_heater_tank_lower_temperature
#     dhw_charge_entity:      sensor.water_heater_dhw_charge
#
#   external_components:
#     - source: github://eman/esphome-alpha-hwr@v0.15.0
#       components: [dhw_demand]
#
#   packages:
#     dhw_demand: github://eman/esphome-alpha-hwr/packages/dhw_demand_detector.yaml@v0.15.0
#
# Usage with alpha_hwr pump (see dhw-demand-example.yaml for full example):
#
#   packages:
#     alpha_hwr: github://eman/esphome-alpha-hwr/packages/alpha_hwr_pairing.yaml@v0.15.0
#     dhw_demand: github://eman/esphome-alpha-hwr/packages/dhw_demand_detector.yaml@v0.15.0
#
#   # The alpha_hwr package already declares external_components for both
#   # alpha_hwr and dhw_demand, so no separate declaration is needed.
#   # See dhw-demand-example.yaml for a complete working configuration.
# ==============================================================================

sensor:
  # ── Household flow meter — GPM (primary demand ground truth) ───────────────
  - platform: homeassistant
    id: dhw_flow
    entity_id: ${flow_entity}
    unit_of_measurement: "GPM"
    accuracy_decimals: 3

  # ── Lower tank temperature — °F (thermal collapse signal) ──────────────────
  - platform: homeassistant
    id: dhw_tank_lower_temp
    entity_id: ${tank_lower_temp_entity}
    unit_of_measurement: "°F"
    accuracy_decimals: 2

  # ── DHW charge percentage — % (charge drop signal) ─────────────────────────
  - platform: homeassistant
    id: dhw_charge_pct
    entity_id: ${dhw_charge_entity}
    unit_of_measurement: "%"
    accuracy_decimals: 1

# ── DHW Demand Detector ────────────────────────────────────────────────────────
#
# Wired with supplementary HA sensors only.
# To add pump telemetry, define a top-level dhw_demand: block in your main YAML
# with the sensor ID keys listed below. ESPHome merges that block with this
# package's dhw_demand: definition, so only add the keys you want to override or
# extend.
#
#   dhw_demand:
#     motor_speed:    <your_motor_speed_sensor_id>
#     motor_current:  <your_motor_current_sensor_id>
#     pump_flow:      <pump_flow_gpm_sensor_id>         # must be in GPM
#     # Optional: if your water heater exposes a DHW in-use flag
#     dhw_in_use:     dhw_in_use_flag
#
# `pump_flow` and `motor_speed` are what make pump-on detection work: household
# demand is measured as (flow - pump_flow), gated on motor_speed. Without both,
# the detector still runs but reports `pump_on_uncertain` whenever the pump is
# on.
#
# NOTE: alpha_hwr reports flow in m³/h.  Create a platform: copy sensor with a
# multiply filter to convert before referencing.  Do not reuse an
# already-converted sensor here or the thresholds will be wrong:
#   1 m³/h = 4.40287 GPM
#
# `inlet_pressure`, `pump_power` and `pump_head_rate` were removed in issue
# #149 along with the hydraulic vote tier that read them; a config still
# setting one now fails validation with an explanation.
# See dhw-demand-example.yaml for a complete working configuration.

dhw_demand:
  # ── Outputs ─────────────────────────────────────────────────────────────────
  demand:
    id: dhw_demand_binary
    name: "DHW Demand"
    icon: "mdi:water-boiler"


  confidence:
    id: dhw_demand_confidence
    name: "DHW Detection Confidence"
    icon: "mdi:gauge"
    entity_category: diagnostic

  # Estimated draw intensity, 0.0–1.0 (not a flow rate). Held at the last live
  # value while demand_release_seconds is latching.
  demand_level:
    id: dhw_demand_level
    name: "DHW Demand Level"
    icon: "mdi:water-percent"
    entity_category: diagnostic

  session_duration:
    id: dhw_session_duration
    name: "DHW Session Duration"
    icon: "mdi:timer"

  detection_method:
    id: dhw_detection_method
    name: "DHW Detection Method"
    entity_category: diagnostic

  # ── Supplementary HA sensor inputs ──────────────────────────────────────────
  flow:    dhw_flow
  tank_lower_temp: dhw_tank_lower_temp
  dhw_charge:      dhw_charge_pct

  # ── Detection thresholds ─────────────────────────────────────────────────────
  # Defaults match Python DetectorConfig. Override in your main YAML if needed.
  pump_off_current_threshold: 0.03      # A
  flow_threshold: 0.3           # GPM
  thermal_collapse_rate: 0.05           # °F/s
  dhw_charge_drop_rate: 0.005           # %/s
  # ── Pump-on demand measurement (only used when pump sensors present) ───────
  # Household demand while the pump runs is measured, not voted on:
  # (household flow meter - pump loop flow). Three guards carry it.
  pump_on_demand_flow_threshold: 0.3    # GPM of *computed* demand. Shares the
                                        # value of flow_threshold deliberately,
                                        # so both pump regimes agree on what
                                        # counts as flow.
  pump_on_demand_min_speed_rpm: 1950    # RPM. Below this the pump's own loop
                                        # flow estimate reads low and the
                                        # difference goes spuriously positive
                                        # with no draw. Admits the entire
                                        # production range.
  pump_on_demand_max_stale_seconds: 30  # The pump reports every 10 s.
  flow_max_stale_seconds: 60         # The meter reports on change, median
                                        # 28 s while flowing — so this bound is
                                        # deliberately looser than the pump's.
  # How long the heater's DHW in-use flag must stay continuously high before it
  # may declare a pump-on draw on its own. The flag fires ~77 times a day with a
  # median duration of 15 s; 70 s clears 89.7 % of those. Only used when
  # dhw_in_use is wired. Set to 0 to accept the bare flag (bench/debug only).
  dhw_in_use_min_seconds: 70
  flow_latch_seconds: 30
  # Disarms the latch above for this long after the pump stops. Loop flow
  # collapses through the flow threshold within seconds of the motor parking,
  # so without this the latch is armed by the pump's own flow and holds a
  # thermal/charge verdict alive on it. Matched to flow_latch_seconds so no
  # shutdown reading can arm it; 0 disables.
  latch_pump_off_suppression_seconds: 30
  session_gap_tolerance_seconds: 60
  # How long demand stays latched after the last positive tick. Stops an input
  # dithering around its threshold from chattering the demand binary sensor.
  # Set to 0 to disable and publish the raw per-tick result.
  demand_release_seconds: 30
