# ==============================================================================
# ALPHA HWR Control Package
# ==============================================================================
#
# Everything you drive from Home Assistant, layered on the pump package:
# - Engage Pump, Remote Mode, Schedule Enabled, Temperature AutoAdapt and the
#   two flow-limit switches
# - Control mode selector for the exposed operating modes
# - Setpoint, temperature-range, cycle-time and flow-limit numbers
# - Restart and Read Pump Clock buttons, Pump Motor Active indicator
# - The schedule editor helpers used by the Lovelace schedule card: day/layer
#   selects, time and date numbers, save/clear/vacation buttons. They are
#   `internal: true`, so they add nothing to the Home Assistant entity list
#   unless a dashboard references them. The schedule services themselves are
#   registered by the component (components/alpha_hwr/api_bridge.cpp) and
#   exist whether or not this package is loaded.
#
# Usage:
#   packages:
#     alpha_hwr: !include packages/alpha_hwr.yaml
#     alpha_hwr_controls: !include packages/alpha_hwr_controls.yaml
#
# Requirements:
# - Main alpha_hwr component must have id: pump
# - Motor Speed sensor must have id: motor_speed
#
# ==============================================================================

# Editor state shared by the schedule-editor helpers below.
globals:
  - id: sched_edit_day
    type: int
    initial_value: '0'
  - id: sched_edit_layer
    type: int
    initial_value: '0'


switch:
  # ── Flow limiter enables (issue #299) ────────────────────────────────────
  #
  # The other half of the Max/Min Flow Limit numbers. Each turns its limiter on
  # or off while KEEPING the stored cap -- the write's NAN sentinel -- so the
  # two controls do not fight over one record.
  #
  # Reads as off until the limiter has been read, which needs `flow_limiter` or
  # `flow_limited` declared. `binary_sensor`/`switch` de-duplicate publishes in
  # ESPHome, so the lambda needs no change gate of its own (issue #127).
  #
  # Enabling a limiter really does constrain the pump -- and does nothing at all
  # in Cycle Time mode, which ignores the cap. See docs/configuration.md.
  - platform: template
    name: "Max Flow Limit Enabled"
    id: max_flow_limit_enabled
    icon: "mdi:speedometer-slow"
    entity_category: config
    optimistic: false
    lambda: |-
      const auto &c = id(pump).limiter_state().max_flow;
      if (!c.valid) return {};  // unknown until read -- not "off" (#299)
      return c.enabled;
    turn_on_action:
      - lambda: 'id(pump).set_flow_limiter_from_entity(600, true, NAN);'
    turn_off_action:
      - lambda: 'id(pump).set_flow_limiter_from_entity(600, false, NAN);'

  - platform: template
    name: "Min Flow Limit Enabled"
    id: min_flow_limit_enabled
    icon: "mdi:speedometer-slow"
    entity_category: config
    optimistic: false
    lambda: |-
      const auto &c = id(pump).limiter_state().min_flow;
      if (!c.valid) return {};  // unknown until read -- not "off" (#299)
      return c.enabled;
    turn_on_action:
      - lambda: 'id(pump).set_flow_limiter_from_entity(601, true, NAN);'
    turn_off_action:
      - lambda: 'id(pump).set_flow_limiter_from_entity(601, false, NAN);'

  # Engage Pump — mutually exclusive with the schedule, like the Grundfos GO
  # app's start/stop button. It engages the pump's configured mode now
  # (operation_mode AUTO) and NOT gated by an enabled schedule. Whether the
  # motor physically spins is mode-dependent: continuous in the constant modes
  # (speed/flow/pressure), cycling per the mode in Temperature/Cycle-Time — see
  # the "Pump Motor Active" binary sensor for the actual motor state. Turning it
  # on disables the schedule; turning it off stops the pump. The switch reads
  # derived state from the pump, so "Schedule Enabled" flips off on its own — no
  # optimistic faking. (Bench-proven: the schedule only runs the pump while it
  # is AUTO, so the reconciliation forces AUTO when scheduling and never leaves
  # a dead STOP+schedule state.)
  - platform: template
    name: "Engage Pump"
    id: engage_pump_switch
    icon: "mdi:pump"
    optimistic: false
    lambda: |-
      bool state = false;
      if (id(pump).get_engage_pump_state(&state)) return state;
      return {};  // unknown until run-state + schedule are cached
    turn_on_action:
      - lambda: 'id(pump).set_engage_pump(true);'
    turn_off_action:
      - lambda: 'id(pump).set_engage_pump(false);'

  # Schedule Enable/Disable Control.
  # Enabling forces the pump to AUTO so the schedule can actually run it (a
  # STOP + schedule-enabled pump never runs); disabling stops the pump. "Engage
  # Pump" reflects the coupling on its own via the pump readback.
  - platform: template
    name: "Schedule Enabled"
    icon: "mdi:calendar-clock"
    optimistic: false  # Read actual state from pump
    lambda: |-
      bool enabled = false;
      if (id(pump).get_schedule_state(&enabled)) {
        return enabled;
      }
      return {};  // Return unknown if state not cached yet
    turn_on_action:
      - lambda: 'id(pump).set_schedule(true);'
    turn_off_action:
      - lambda: 'id(pump).set_schedule(false);'

  # Remote Mode Toggle
  - platform: template
    name: "Remote Mode"
    icon: "mdi:remote"
    optimistic: false  # Read actual state from pump state tracking
    lambda: |-
      bool enabled = false;
      if (id(pump).get_remote_state(&enabled)) {
        return enabled;
      }
      return {};  // Return unknown until a control_source has been read
    turn_on_action:
      - lambda: |-
          ESP_LOGI("switch", "Enabling remote mode...");
          bool result = id(pump).enable_remote();
          ESP_LOGI("switch", "Enable remote result: %s", result ? "SUCCESS" : "FAILED");
    turn_off_action:
      - lambda: |-
          ESP_LOGI("switch", "Disabling remote mode (returning to Auto)...");
          bool result = id(pump).disable_remote();
          ESP_LOGI("switch", "Disable remote result: %s", result ? "SUCCESS" : "FAILED");

  # Temperature Range - AutoAdapt Toggle (Mode 27)
  - platform: template
    name: "Temperature AutoAdapt"
    id: temp_autoadapt
    icon: "mdi:auto-fix"
    optimistic: false
    disabled_by_default: false
    lambda: |-
      if (!id(pump).is_mode_valid()) return {};
      if (id(pump).get_control_mode() != esphome::alpha_hwr::services::ControlMode::TEMPERATURE_RANGE) {
        return {};
      }
      int8_t aa = id(pump).get_cached_autoadapt();
      if (aa < 0) return {};
      return (bool)(aa == 1);
    turn_on_action:
      - lambda: |-
          float min_temp = id(pump).get_cached_temp_min();
          float max_temp = id(pump).get_cached_temp_max();
          if (std::isnan(min_temp) || std::isnan(max_temp)) {
            ESP_LOGE("switch", "Cannot change AutoAdapt: temperature range not yet cached from pump");
            return;
          }
          
          ESP_LOGI("switch", "Enabling Temperature AutoAdapt");
          id(pump).set_temperature_range(min_temp, max_temp, true, [](bool success) {
            if (success) {
              ESP_LOGI("switch", "✓ AutoAdapt enabled successfully");
            } else {
              ESP_LOGW("switch", "Failed to enable AutoAdapt");
            }
          });
    turn_off_action:
      - lambda: |-
          float min_temp = id(pump).get_cached_temp_min();
          float max_temp = id(pump).get_cached_temp_max();
          if (std::isnan(min_temp) || std::isnan(max_temp)) {
            ESP_LOGE("switch", "Cannot change AutoAdapt: temperature range not yet cached from pump");
            return;
          }
          
          ESP_LOGI("switch", "Disabling Temperature AutoAdapt");
          id(pump).set_temperature_range(min_temp, max_temp, false, [](bool success) {
            if (success) {
              ESP_LOGI("switch", "✓ AutoAdapt disabled successfully");
            } else {
              ESP_LOGW("switch", "Failed to disable AutoAdapt");
            }
          });

button:
  - platform: restart
    name: "Restart HWR Pump"
  
  - platform: template
    name: "Read Pump Clock"
    icon: "mdi:clock-check"
    on_press:
      - lambda: |-
          ESP_LOGI("button", "Manual pump clock read requested");
          id(pump).read_pump_clock();

  - platform: template
    name: "Save Schedule Entry"
    icon: "mdi:content-save"
    internal: true
    on_press:
      - lambda: |-
          uint8_t layer = (uint8_t)id(sched_edit_layer);
          uint8_t day = (uint8_t)id(sched_edit_day);
          uint8_t sh = (uint8_t)id(sched_start_hour).state;
          uint8_t sm = (uint8_t)id(sched_start_minute).state;
          uint8_t eh = (uint8_t)id(sched_end_hour).state;
          uint8_t em = (uint8_t)id(sched_end_minute).state;
          
          static const char* DAYS[] = {"Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"};
          
          ESP_LOGI("sched_editor", "Saving: %s L%d %02d:%02d-%02d:%02d",
                   DAYS[day], layer, sh, sm, eh, em);
          
          esphome::alpha_hwr::ScheduleEntry entry(
            DAYS[day], sh, sm, eh, em, 0x02, layer, true);
          
          id(pump).set_schedule_entry(layer, day, entry, [](bool success) {
            if (success) {
              ESP_LOGI("sched_editor", "✓ Schedule entry saved");
            } else {
              ESP_LOGW("sched_editor", "✗ Failed to save schedule entry");
            }
          });

  - platform: template
    name: "Clear Schedule Entry"
    icon: "mdi:delete"
    internal: true
    on_press:
      - lambda: |-
          uint8_t layer = (uint8_t)id(sched_edit_layer);
          uint8_t day = (uint8_t)id(sched_edit_day);
          
          static const char* DAYS[] = {"Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"};
          ESP_LOGI("sched_editor", "Clearing: %s L%d", DAYS[day], layer);
          
          id(pump).clear_schedule_entry_async(layer, day, [](bool success) {
            if (success) {
              ESP_LOGI("sched_editor", "✓ Schedule entry cleared");
            } else {
              ESP_LOGW("sched_editor", "✗ Failed to clear schedule entry");
            }
          });

  # --------------------------------------------------------------------------
  # Single Event (One-Time Schedule) Management
  # --------------------------------------------------------------------------

  - platform: template
    name: "Add Single Event"
    icon: "mdi:calendar-plus"
    internal: true
    on_press:
      - lambda: |-
          // Get event times from the number inputs
          uint16_t start_month = (uint16_t)id(single_event_start_month).state;
          uint16_t start_day_val = (uint16_t)id(single_event_start_day).state;
          uint16_t start_hour = (uint16_t)id(single_event_start_hour).state;
          uint16_t start_minute = (uint16_t)id(single_event_start_min).state;
          uint16_t end_month = (uint16_t)id(single_event_end_month).state;
          uint16_t end_day_val = (uint16_t)id(single_event_end_day).state;
          uint16_t end_hour = (uint16_t)id(single_event_end_hour).state;
          uint16_t end_minute = (uint16_t)id(single_event_end_min).state;
          
          // Build Unix timestamps anchored to the current year. build_event_window
          // validates the dates, rolls ranges that wrap New Year into next year,
          // and refuses to run before system time is synced.
          uint32_t begin_ts, end_ts;
          if (!id(pump).build_event_window("single_event",
                  start_month, start_day_val, start_hour, start_minute,
                  end_month, end_day_val, end_hour, end_minute,
                  &begin_ts, &end_ts)) {
            return;
          }

          ESP_LOGI("single_event", "Adding event %02d/%02d %02d:%02d - %02d/%02d %02d:%02d",
                   start_month, start_day_val, start_hour, start_minute,
                   end_month, end_day_val, end_hour, end_minute);

          // No slot is chosen here, deliberately. This used to pick one with
          // find_free_single_event_slot() and then write to it by index, which
          // put a gap between the pick and the write that nothing closed: a
          // service call resolving in that gap takes the same slot, writes a
          // live event to it, and this write then overwrites it. Letting the
          // write-operation layer resolve the slot makes the two one step, and
          // is what AGENTS section 6 asks for anyway -- it also means this
          // button gets the recycling WARN and the settle detail that the
          // service path has (issue #262), which a write by index skips.
          //
          // "no free single event slots" now arrives as a rejected settle event
          // rather than a log line here.
          id(pump).submit_set_single_event((uint32_t)begin_ts, (uint32_t)end_ts, "");

  - platform: template
    name: "Clear Single Event"
    icon: "mdi:calendar-remove"
    internal: true
    on_press:
      - lambda: |-
          uint8_t idx = (uint8_t)id(single_event_clear_slot).state;
          ESP_LOGI("single_event", "Clearing single event slot %d", idx);
          id(pump).clear_single_event(idx, [](bool success) {
            if (success) {
              ESP_LOGI("single_event", "✓ Single event cleared");
            } else {
              ESP_LOGW("single_event", "✗ Failed to clear single event");
            }
          });

  - platform: template
    name: "Refresh Single Events"
    icon: "mdi:calendar-refresh"
    internal: true
    on_press:
      - lambda: |-
          id(pump).read_single_events([](bool success, const std::vector<esphome::alpha_hwr::services::SingleEvent>& events) {
            if (success) {
              ESP_LOGI("single_event", "✓ Refreshed %zu events", events.size());
            }
          });

  # --------------------------------------------------------------------------
  # Vacation (multi-day Stop single-event overriding the weekly schedule)
  # --------------------------------------------------------------------------

  - platform: template
    name: "Set Vacation"
    icon: "mdi:beach"
    internal: true
    on_press:
      - lambda: |-
          uint16_t start_month = (uint16_t)id(vacation_start_month).state;
          uint16_t start_day_val = (uint16_t)id(vacation_start_day).state;
          uint16_t end_month = (uint16_t)id(vacation_end_month).state;
          uint16_t end_day_val = (uint16_t)id(vacation_end_day).state;

          // A vacation spans whole days: 00:00 of the start day through 23:59 of
          // the end day, anchored to the current year (build_event_window rolls
          // the end into next year for ranges that wrap New Year, validates the
          // dates, and refuses to run before system time is synced).
          uint32_t begin_ts, end_ts;
          if (!id(pump).build_event_window("vacation",
                  start_month, start_day_val, 0, 0,
                  end_month, end_day_val, 23, 59,
                  &begin_ts, &end_ts)) {
            return;
          }

          ESP_LOGI("vacation", "Setting vacation: %02d/%02d 00:00 - %02d/%02d 23:59",
                   start_month, start_day_val, end_month, end_day_val);

          id(pump).submit_set_vacation(begin_ts, end_ts, "");

  - platform: template
    name: "Clear Vacation"
    icon: "mdi:beach"
    internal: true
    on_press:
      - lambda: |-
          ESP_LOGI("vacation", "Clearing active vacation");
          id(pump).submit_clear_vacation("");

select:
  # Pump Control Mode Selector
  # Six modes, chosen to match what the Grundfos GO app offers for the ALPHA
  # HWR. (This comment said "5 main control modes" while listing six; the count
  # was wrong, not the list. Nothing else in the repo records what the app
  # shows, so treat the pairing as the original author's observation rather
  # than something a capture pins.)
  # Note: This is separate from the Weekly Schedule feature (enable/disable via Object 82, Sub 104)
  - platform: template
    name: "Pump Control Mode"
    id: pump_mode_select
    icon: "mdi:tune"
    optimistic: false  # Read actual state from pump state tracking
    # 5s to match the setpoint numbers below. The mode only moves when someone
    # changes it (pump-side changes surface via control_state_poll_interval,
    # 30s), and every poll used to emit an API state frame per subscriber
    # whether or not it changed — see publish_option_if_changed() (#127).
    update_interval: 5s
    options:
      - "Cycle Time Control"
      - "Constant Speed"
      - "Proportional Pressure"
      - "Temperature Control"
      - "Constant Flow"
      - "Constant Pressure"
    lambda: |-
      // Check if mode is valid before trying to display it
      if (!id(pump).is_mode_valid()) {
        return {};  // Return empty optional - select will show no selection
      }
      
      esphome::alpha_hwr::services::ControlMode mode = id(pump).get_control_mode();
      std::string mode_str;
      
      // Map protocol modes to UI labels (must match get_mode_name() output)
      if (mode == esphome::alpha_hwr::services::ControlMode::DHW_ON_OFF) {
        mode_str = "Cycle Time Control";
      } else if (mode == esphome::alpha_hwr::services::ControlMode::CONSTANT_SPEED) {
        mode_str = "Constant Speed";
      } else if (mode == esphome::alpha_hwr::services::ControlMode::PROPORTIONAL_PRESSURE) {
        mode_str = "Proportional Pressure";
      } else if (mode == esphome::alpha_hwr::services::ControlMode::TEMPERATURE_RANGE) {
        mode_str = "Temperature Control";
      } else if (mode == esphome::alpha_hwr::services::ControlMode::CONSTANT_FLOW) {
        mode_str = "Constant Flow";
      } else if (mode == esphome::alpha_hwr::services::ControlMode::CONSTANT_PRESSURE) {
        mode_str = "Constant Pressure";
      } else {
        return {};  // Return empty optional for unknown modes
      }
      // Publish only when the mode actually moved: an unconditional republish
      // every interval costs one API state frame per subscriber (#127).
      return esphome::alpha_hwr::publish_option_if_changed(id(pump_mode_select), mode_str);
    set_action:
      - lambda: |-
          ESP_LOGI("select", "Setting mode to: %s", x.c_str());
          
          esphome::alpha_hwr::services::ControlMode mode;
          
          if (x == "Cycle Time Control") {
            mode = esphome::alpha_hwr::services::ControlMode::DHW_ON_OFF;
          } else if (x == "Constant Speed") {
            mode = esphome::alpha_hwr::services::ControlMode::CONSTANT_SPEED;
          } else if (x == "Proportional Pressure") {
            mode = esphome::alpha_hwr::services::ControlMode::PROPORTIONAL_PRESSURE;
          } else if (x == "Temperature Control") {
            mode = esphome::alpha_hwr::services::ControlMode::TEMPERATURE_RANGE;
          } else if (x == "Constant Flow") {
            mode = esphome::alpha_hwr::services::ControlMode::CONSTANT_FLOW;
          } else if (x == "Constant Pressure") {
            mode = esphome::alpha_hwr::services::ControlMode::CONSTANT_PRESSURE;
          } else {
            ESP_LOGW("select", "Unknown mode: %s", x.c_str());
            return;
          }
          
          // set_control_mode() returns after queueing the command; the actual
          // send resolves asynchronously, so this only reports whether the
          // request was accepted for dispatch (not that the pump applied it).
          bool queued = id(pump).set_control_mode(mode);
          ESP_LOGI("select", "Mode change %s: %s", queued ? "queued" : "rejected", x.c_str());

  - platform: template
    name: "Schedule Editor Day"
    id: sched_editor_day
    icon: "mdi:calendar"
    internal: true
    optimistic: true
    options:
      - "Monday"
      - "Tuesday"
      - "Wednesday"
      - "Thursday"
      - "Friday"
      - "Saturday"
      - "Sunday"
    initial_option: "Monday"
    set_action:
      - lambda: |-
          int idx = 0;
          if (x == "Tuesday") idx = 1;
          else if (x == "Wednesday") idx = 2;
          else if (x == "Thursday") idx = 3;
          else if (x == "Friday") idx = 4;
          else if (x == "Saturday") idx = 5;
          else if (x == "Sunday") idx = 6;
          id(sched_edit_day) = idx;
          
          // Load current entry for this day from cache
          uint8_t layer = (uint8_t)id(sched_edit_layer);
          esphome::alpha_hwr::ScheduleEntry entry;
          if (id(pump).get_cached_schedule_entry(layer, idx, &entry)) {
            if (entry.is_enabled()) {
              auto start_h = id(sched_start_hour);
              auto start_m = id(sched_start_minute);
              auto end_h = id(sched_end_hour);
              auto end_m = id(sched_end_minute);
              start_h->publish_state(entry.get_begin_hour());
              start_m->publish_state(entry.get_begin_minute());
              end_h->publish_state(entry.get_end_hour());
              end_m->publish_state(entry.get_end_minute());
              ESP_LOGI("sched_editor", "Loaded: %s %02d:%02d-%02d:%02d",
                       x.c_str(), entry.get_begin_hour(), entry.get_begin_minute(),
                       entry.get_end_hour(), entry.get_end_minute());
            } else {
              ESP_LOGI("sched_editor", "%s: no schedule (disabled)", x.c_str());
            }
          }

  - platform: template
    name: "Schedule Editor Layer"
    id: sched_editor_layer
    icon: "mdi:layers"
    internal: true
    optimistic: true
    options:
      - "Layer 0"
      - "Layer 1"
      - "Layer 2"
      - "Layer 3"
      - "Layer 4"
    initial_option: "Layer 0"
    set_action:
      - lambda: |-
          int idx = 0;
          if (x == "Layer 1") idx = 1;
          else if (x == "Layer 2") idx = 2;
          else if (x == "Layer 3") idx = 3;
          else if (x == "Layer 4") idx = 4;
          id(sched_edit_layer) = idx;

number:
# ========== Control Mode Setpoints ==========
# Each control mode has specific setpoint parameters
# These number entities dynamically show/hide based on the active mode
  # Constant Pressure Setpoint (Mode 0)
  - platform: template
    name: "Constant Pressure Setpoint"
    id: constant_pressure_setpoint
    icon: "mdi:gauge"
    unit_of_measurement: "m"
    min_value: 0.5
    max_value: 10.0
    step: 0.1
    mode: slider
    optimistic: false
    update_interval: 5s
    disabled_by_default: false
    lambda: |-
      float v = NAN;  // NAN = not applicable in the active control mode
      if (id(pump).get_control_mode() == esphome::alpha_hwr::services::ControlMode::CONSTANT_PRESSURE)
        v = id(pump).get_cached_pressure_setpoint();
      // Publish only on change: an unconditional republish every interval
      // costs one API state frame per subscriber (#127).
      return esphome::alpha_hwr::publish_number_if_changed(id(constant_pressure_setpoint), v);
    set_action:
      - lambda: |-
          ESP_LOGI("number", "Setting constant pressure setpoint to %.2f m", x);
          id(pump).set_constant_pressure(x, [](bool success) {
            if (success) {
              ESP_LOGI("number", "✓ Pressure setpoint updated successfully");
            } else {
              ESP_LOGW("number", "Failed to update pressure setpoint");
            }
          });

  # Constant Speed (RPM) Setpoint (Mode 2)
  - platform: template
    name: "Constant Speed Setpoint"
    id: constant_speed_setpoint
    icon: "mdi:speedometer"
    unit_of_measurement: "RPM"
    min_value: 500
    max_value: 4500
    # 25 RPM: the pump resolves steps this fine (each one yields a distinct,
    # progressively higher flow), and a 100 RPM step was coarse enough that one
    # click moved flow by ~20-25%. 25 also divides the 500 RPM floor evenly, so
    # hardware minimums like 1650 are directly selectable rather than having to
    # be reached by undershooting and waiting for the pump to clamp (#108).
    step: 25
    mode: slider
    optimistic: false
    update_interval: 5s
    disabled_by_default: false
    lambda: |-
      float v = NAN;  // NAN = not applicable in the active control mode
      if (id(pump).get_control_mode() == esphome::alpha_hwr::services::ControlMode::CONSTANT_SPEED)
        v = id(pump).get_cached_speed_setpoint();
      return esphome::alpha_hwr::publish_number_if_changed(id(constant_speed_setpoint), v);  // on change only (#127)
    set_action:
      - lambda: |-
          ESP_LOGI("number", "Setting constant speed setpoint to %.0f RPM", x);
          id(pump).set_constant_speed(x, [](bool success) {
            if (success) {
              ESP_LOGI("number", "✓ Speed setpoint updated successfully");
            } else {
              ESP_LOGW("number", "Failed to update speed setpoint");
            }
          });

  # Constant Flow Setpoint (Mode 8)
  - platform: template
    name: "Constant Flow Setpoint"
    id: constant_flow_setpoint
    icon: "mdi:water-pump"
    device_class: volume_flow_rate
    unit_of_measurement: "m³/h"
    min_value: 0.1
    max_value: 10.0
    step: 0.1
    mode: slider
    optimistic: false
    update_interval: 5s
    disabled_by_default: false
    lambda: |-
      float v = NAN;  // NAN = not applicable in the active control mode
      if (id(pump).get_control_mode() == esphome::alpha_hwr::services::ControlMode::CONSTANT_FLOW)
        v = id(pump).get_cached_flow_setpoint();
      return esphome::alpha_hwr::publish_number_if_changed(id(constant_flow_setpoint), v);  // on change only (#127)
    set_action:
      - lambda: |-
          ESP_LOGI("number", "Setting constant flow setpoint to %.2f m³/h", x);
          id(pump).set_constant_flow(x, [](bool success) {
            if (success) {
              ESP_LOGI("number", "✓ Flow setpoint updated successfully");
            } else {
              ESP_LOGW("number", "Failed to update flow setpoint");
            }
          });

  # Temperature Range - Minimum Temperature (Mode 27)
  - platform: template
    name: "Temperature Range Min"
    id: temp_range_min
    icon: "mdi:thermometer-low"
    device_class: temperature
    unit_of_measurement: "°C"
    min_value: 20
    max_value: 70
    step: 1
    mode: slider
    optimistic: false
    update_interval: 5s
    disabled_by_default: false
    lambda: |-
      float v = NAN;  // NAN = not applicable in the active control mode
      if (id(pump).get_control_mode() == esphome::alpha_hwr::services::ControlMode::TEMPERATURE_RANGE)
        v = id(pump).get_cached_temp_min();
      return esphome::alpha_hwr::publish_number_if_changed(id(temp_range_min), v);  // on change only (#127)
    set_action:
      - lambda: |-
          float max_temp = id(pump).get_cached_temp_max();
          if (std::isnan(max_temp)) {
            ESP_LOGE("number", "Cannot change min temp: max temp not yet cached from pump");
            return;
          }
          int8_t aa = id(pump).get_cached_autoadapt();
          if (aa == -1) {
            ESP_LOGE("number", "Cannot change min temp: autoadapt state not yet cached from pump");
            return;
          }
          bool autoadapt = (aa != 0);
          
          ESP_LOGI("number", "Setting temperature range: %.1f°C - %.1f°C", x, max_temp);
          id(pump).set_temperature_range(x, max_temp, autoadapt, [](bool success) {
            if (success) {
              ESP_LOGI("number", "✓ Temperature range updated successfully");
            } else {
              ESP_LOGW("number", "Failed to update temperature range");
            }
          });

