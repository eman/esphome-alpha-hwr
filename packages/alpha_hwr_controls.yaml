  # Cycle Flow (Mode 25 - DHW Cycle Time Control): the flow the pump targets
  # during ON periods in cycle mode (Obj 91 Sub 421 stored setpoint, issue
  # #107). Shows unknown until the DHW config has been read from the pump.
  #
  # NOTE: the Grundfos GO app has no equivalent control on any ordinary screen
  # and the manual says this mode has no flow parameter -- but the app's
  # COMMISSIONING flow writes this field, computing a value from the largest
  # supply pipe dimension and the pipe material (issue #280). So it is a loop
  # flow limit the vendor sets and then hides, not a register this component
  # repurposed, and it survives normal app use: changing cycle times in the GO
  # app preserves it. Bench-measured within 1% across four setpoints.
  # See docs/configuration.md.
  # Box input rather than slider: 0.01 m³/h precision over 0.1-10.0 (the
  # factory value 0.23 m³/h = 1.0 gal/min needs finer steps than a slider
  # can usefully offer).
  - platform: template
    name: "Cycle Flow"
    id: cycle_flow
    icon: "mdi:water-pump"
    device_class: volume_flow_rate
    unit_of_measurement: "m³/h"
    min_value: 0.1
    max_value: 10.0
    step: 0.01
    mode: box
    optimistic: false
    update_interval: 5s
    disabled_by_default: false
    lambda: |-
      float v = id(pump).get_cached_cycle_flow();  // NAN until read from the pump
      return esphome::alpha_hwr::publish_number_if_changed(id(cycle_flow), v);  // on change only (#127)
    set_action:
      - lambda: |-
          ESP_LOGI("number", "Setting cycle flow to %.3f m³/h", x);
          id(pump).set_cycle_flow(x, [](bool success) {
            if (success) {
              ESP_LOGI("number", "Cycle flow updated successfully");
            } else {
              ESP_LOGW("number", "Failed to update cycle flow");
            }
          });


  # ── Flow limiters (issue #299) ───────────────────────────────────────────
  #
  # The cap and the enable flag are separate entities over one underlying
  # record, the same shape the component already uses for `set_pump_state` vs
  # the `Engage Pump` / `Schedule Enabled` pair. A `number` carries one value
  # and the write needs both, so the switch keeps the stored cap (the write's
  # NAN sentinel) and the number keeps the stored enable flag.
  #
  # `optimistic: false` and a real lambda, deliberately: the alternative is an
  # optimistic control that drifts the moment anyone changes the limiter in the
  # Grundfos GO app, which is the failure this whole cluster has been about.
  #
  # These read as unknown until the limiter has been read, which needs
  # `flow_limiter` or `flow_limited` declared -- `alpha_hwr.yaml` does.
  #
  # gal/min with no device_class on purpose: Home Assistant then does no unit
  # conversion, so the entity shows exactly the number the service takes and
  # none of the float noise the m³/h controls carry.
  #
  # Bounds are the pump's own factory range for MaxFlow (86/620: 0.5-11.0 gpm).
  # A value outside them settles `clamped` with the stored value reported
  # rather than being silently accepted.
  - platform: template
    name: "Max Flow Limit"
    id: max_flow_limit
    icon: "mdi:speedometer-slow"
    unit_of_measurement: "gal/min"
    min_value: 0.5
    max_value: 11.0
    step: 0.01
    mode: box
    entity_category: config
    optimistic: false
    update_interval: 10s
    lambda: |-
      const auto &c = id(pump).limiter_state().max_flow;
      float v = c.valid ? c.limit_gpm() : NAN;  // NAN until read from the pump
      return esphome::alpha_hwr::publish_number_if_changed(id(max_flow_limit), v);
    set_action:
      - lambda: |-
          // Keep the stored enable flag: this control sets the cap, and the
          // switch below owns whether the limiter is on.
          // Through the entity entry point: it labels the settle event
          // ENTITY, and it refuses when the record is unread -- where c.enabled
          // would be a default-false guess and setting the cap would quietly
          // disable a limiter that was on.
          const auto &c = id(pump).limiter_state().max_flow;
          id(pump).set_flow_limiter_from_entity(600, c.enabled, x);

  - platform: template
    name: "Min Flow Limit"
    id: min_flow_limit
    icon: "mdi:speedometer-slow"
    unit_of_measurement: "gal/min"
    min_value: 1.0
    max_value: 13.0
    step: 0.01
    mode: box
    entity_category: config
