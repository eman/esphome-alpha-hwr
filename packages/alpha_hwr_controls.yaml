  # Cycle Time ON Duration (Mode 25 - DHW Cycle Time Control)
  # Reflects the pump's live stored value (Obj 91 Sub 421, issue #106); shows
  # unknown until the config has been read from the pump.
  - platform: template
    name: "Cycle Time ON"
    id: cycle_time_on
    icon: "mdi:timer-play"
    device_class: duration
    unit_of_measurement: "min"
    min_value: 1
    max_value: 60
    step: 1
    mode: slider
    optimistic: false
    update_interval: 5s
    disabled_by_default: false
    lambda: |-
      int8_t val = id(pump).get_cached_cycle_time_on();
      float v = val > 0 ? (float) val : NAN;  // NAN = config not read from the pump yet
      return esphome::alpha_hwr::publish_number_if_changed(id(cycle_time_on), v);  // on change only (#127)
    set_action:
      - lambda: |-
          // OFF period 0 = keep existing: the write layer resolves it from a
          // mandatory fresh read of the pump's stored config (issue #107),
          // never from a possibly-stale cache or entity state.
          ESP_LOGI("number", "Setting cycle time ON to %.0f min", x);
          id(pump).set_cycle_time_control((uint8_t)x, 0, [](bool success) {
            if (success) {
              ESP_LOGI("number", "Cycle time updated successfully");
            } else {
              ESP_LOGW("number", "Failed to update cycle time");
            }
          });

