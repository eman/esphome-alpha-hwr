# ==============================================================================
# ALPHA HWR Enhanced Package (with BLE Pairing)
# ==============================================================================
# 
# This package provides FULL telemetry from the Grundfos ALPHA HWR pump
# with BLE pairing/bonding enabled for authenticated access.
#
# Enhanced Telemetry Included:
# - All sensors from alpha_hwr_base.yaml PLUS:
# - AC Voltage (V) - Requires pairing
# - DC Voltage (V) - Requires pairing
# - Motor Current (A) - Requires pairing
# - Inlet Pressure (bar) - Requires pairing
# - PCB Temperature (°C)
# - Control Box Temperature (°C)
# - Active Alarms (text sensor) - Requires pairing
# - Active Warnings (text sensor) - Requires pairing
# - Pairing Status (binary sensor)
# - Pump Link Status (text sensor)
# - Pump Link Fault (text sensor)
#
# Requirements:
# - ESP32 with BLE support
# - Substitutions: ${mac_address} must be defined
#
# Usage:
#   substitutions:
#     mac_address: "AA:BB:CC:DD:EE:FF"
#   
#   packages:
#     alpha_hwr: !include packages/alpha_hwr_pairing.yaml
#
# Note: On first connection, the pump will pair/bond with the ESP32.
# Bonding keys are stored in NVS flash for automatic reconnection.
# ==============================================================================

substitutions:
  # This component's release version, surfaced as the "Component Version"
  # diagnostic entity below (issue #95). Kept in sync automatically by
  # tools/bump_version.sh, which rewrites it alongside the @vX.Y.Z package pin.
  component_version: "0.14.0"

esphome:
  # Publish the (constant) component version once at boot (issue #95).
  on_boot:
    priority: -100
    then:
      - text_sensor.template.publish:
          id: component_version_sensor
          state: "${component_version}"

external_components:
  - source: github://eman/esphome-alpha-hwr@v0.14.0
    components: [alpha_hwr, dhw_demand]

esp32_ble_tracker:
  scan_parameters:
    interval: 1.1s
    window: 1.1s
  # Populate advertisement identifiers (product_version etc.) before the
  # GATT connection opens.  ESPHome's BLEClientNode does not receive scan
  # result events directly, so we hook them here via the tracker trigger.
  # Filtered by MAC so a second Grundfos device on the same network cannot
  # populate the one-shot advertisement cache with the wrong identifiers.
  on_ble_service_data_advertise:
    - mac_address: ${mac_address}
      service_uuid: FE5D
      then:
        - lambda: "pump->on_ble_service_data_seen(x);"

ble_client:
  - mac_address: ${mac_address}
    id: hwr_pump_client

logger:
  # INFO by default: every log line is an API frame fanned out to *every*
  # subscriber, and a node being actively debugged (Home Assistant + an
  # `esphome logs` stream + a script) is exactly when heap pressure on the API
  # write path can reboot it (issue #127). Override with `logger: level: DEBUG`
  # in your own config when you need it — the main config wins over the package.
  level: INFO

# Runtime heap, so a slow leak or fragmentation trend is visible before it
# aborts in the API write path, and answerable afterwards (issue #127).
# These publish on every 60s poll — heap genuinely moves, so unlike the control
# entities there is nothing here to gate on change.
debug:
  update_interval: 60s

sensor:
  - platform: debug
    free:
      name: "Free Heap"
    block:
      name: "Largest Free Block"
    min_free:
      name: "Min Free Heap"
    fragmentation:
      name: "Heap Fragmentation"

# Ensure text_sensor component is included in build
text_sensor:
  # This ESPHome component's own version (issue #95). Distinct from the pump's
  # Software/Hardware/BLE/Product Version entities below, which report the pump
  # firmware. Recorded in Home Assistant history so the component version that
  # produced any state is answerable after the fact.
  - platform: template
    name: "Component Version"
    id: component_version_sensor
    icon: "mdi:package-variant"
    entity_category: diagnostic
    update_interval: never  # constant value; published once at boot (see esphome.on_boot)

  # Why the node last rebooted — published once at boot. A panic reboot is
  # otherwise indistinguishable from an OTA or a power cycle after the fact.
  - platform: debug
    reset_reason:
      name: "Reset Reason"

api:
  # Required by the alpha_hwr programmatic write services + write_settled event (issue #92)
  custom_services: true
  homeassistant_services: true

time:
  - platform: homeassistant
    id: hwr_time

alpha_hwr:
   id: pump
   ble_client_id: hwr_pump_client
   time_id: hwr_time
   enable_pairing: true  # Enable BLE pairing for enhanced telemetry and control
    
   # Pairing Status
   pairing_status:
     name: "Pairing Status"
   ready_status:
     name: "Pump Ready"

   # Which build is installed: component source revision + firmware build time.
   # "Component Version" below is the release version and only changes at a
   # release, so it cannot tell two builds apart (issue #124).
   component_build:
     name: "Component Build"

   # Pump Link Status (coarse connection health) + latched last-failure detail
   pump_link_status:
     name: "Pump Link Status"
   pump_last_link_failure:
     name: "Pump Link Fault"

   # Run state, and the alarm for the illegal "schedule on but pump stopped"
   # state that silently loses every window (issue #124). "Engage Pump" reads
   # off for both AUTO and STOP once the schedule is on, so these are the only
   # entities that distinguish a scheduled pump from a stalled one.
   pump_run_state:
     name: "Pump Run State"
   schedule_stalled:
     name: "Schedule Stalled"

   # Enhanced Electrical (requires pairing)
   voltage:
     name: "AC Voltage"
   voltage_dc:
     name: "DC Voltage"
   current:
     name: "Motor Current"
   
   # Basic Telemetry
   power:
     name: "Power Consumption"
   rpm:
     id: motor_speed
     name: "Motor Speed"
   flow:
     name: "Flow Rate"
   head:
     name: "Head Pressure"
   head_rate:
     id: pump_head_rate_sensor
     name: "Head Pressure Rate"
     entity_category: diagnostic
   
   # Pressure Sensors (requires pairing)
   inlet_pressure:
     name: "Inlet Pressure"
   
   # Temperature Sensors (all)
   temp_media:
     name: "Water Temperature"
     id: temp_media_sensor
   temp_pcb:
     name: "PCB Temperature"
   temp_control_box:
     name: "Control Box Temperature"
   
   # Alarms & Warnings
   alarms:
     name: "Active Alarms"
   warnings:
     name: "Active Warnings"
   
   # Canonical schedule hash (RFC-005) — sync-verification sensor for the
   # dhw-sensor-apps recirculation scheduler ("unknown" until fully cached)
   schedule_hash:
      name: "Schedule Hash"

   # Per-layer schedule read-back (issue #7) — each layer's compact JSON
   # always fits HA's 255-char state cap, enabling full-grid recovery
   schedule_layer_0:
      name: "Schedule Layer 0"
   schedule_layer_1:
      name: "Schedule Layer 1"
   schedule_layer_2:
      name: "Schedule Layer 2"
   schedule_layer_3:
      name: "Schedule Layer 3"
   schedule_layer_4:
      name: "Schedule Layer 4"
   
   # Single Events Display
   single_events:
      name: "Single Events"

   # Vacation (active pump-off period; multi-day Stop single-event)
   vacation:
      name: "Vacation"

   # Event Log Display
   event_log:
      name: "Event Log"
      entity_category: diagnostic
      internal: true
   
   # History Trends Display
   history:
      name: "History Trends"
      entity_category: diagnostic
      internal: true
   
   # Cycle Timestamps (last 10 cycles)
   cycle_timestamps:
      name: "Cycle Timestamps"
      entity_category: diagnostic
      internal: true
   
   # Operating Statistics (Diagnostic)
   start_count:
      name: "Start Count"
   operating_hours:
      name: "Operating Hours"

   # Clock Sync Diagnostics
   clock_diff:
      name: "Clock Drift"
      id: hwr_clock_diff
   last_clock_sync:
      name: "Last Clock Sync"
      id: hwr_last_clock_sync
   
   # Control Mode Display
   control_mode:
      name: "Control Mode"
      icon: "mdi:cog"
   
   # Device Information (Diagnostic)
   # These appear in the Device Info card's diagnostic section in Home Assistant
   serial_number:
      name: "Serial Number"
      entity_category: diagnostic
   software_version:
      name: "Software Version"  
      entity_category: diagnostic
   hardware_version:
      name: "Hardware Version"
      entity_category: diagnostic
   ble_version:
      name: "BLE Version"
      entity_category: diagnostic
   product_name:
      name: "Product Name"
      entity_category: diagnostic
   # Advertisement-derived BLE firmware discriminator (family/type/version
   # bytes broadcast in the FE5D service data, captured at scan time before
   # the GATT connection opens).
   product_version:
      name: "Product Version"
      entity_category: diagnostic
